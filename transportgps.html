<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Transit Quest</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

    
<div id="transitModal" class="transit-modal">
  <div class="transit-card">
    <h2>🚌 Transit Quest</h2>

    <p id="gpsMessage">
      Aktifkan lokasi untuk mulai menghitung perjalananmu!
    </p>

    <div id="distanceInfo">
      Jarak perjalanan: 0 km
    </div>

    <button id="startTracking">
      Aktifkan Lokasi
    </button>

    <button id="stopTracking" hidden>
      Selesaikan Perjalanan
    </button>

    <button id="closeTransit">
      Tutup
    </button>
  </div>
</div>


  <script src="script.js"></script>
</body>
</html>
